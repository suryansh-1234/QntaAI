<!DOCTYPE html>
<html lang="en">

<head>
    <link
        rel="manifest"
        href="/static/manifest.json"
    >

    <link
        rel="icon"
        type="image/svg+xml"
        href="/favicon.svg"
    >

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#09090b"
    >

    <title>QntaAI</title>

    <style>
        :root {
            --bg: #09090b;
            --sidebar: #111113;
            --surface: #18181b;
            --surface-2: #202024;
            --border: rgba(255, 255, 255, .09);
            --text: #f4f4f5;
            --muted: #a1a1aa;
            --accent: #8b5cf6;
            --accent-2: #a78bfa;
            --user: #2a2735;
            --max-chat: 850px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text);

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            overflow: hidden;
        }

        button,
        textarea {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        /* =========================
           APP
        ========================= */

        .app {
            display: flex;

            width: 100%;
            height: 100dvh;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 280px;
            height: 100%;

            flex-shrink: 0;

            display: flex;
            flex-direction: column;

            background: var(--sidebar);

            border-right:
                1px solid var(--border);

            padding: 14px;

            z-index: 50;

            transition:
                transform .25s ease;
        }

        .brand {
            display: flex;
            align-items: center;

            gap: 11px;

            padding:
                10px 8px 20px;
        }

        .brand-icon {
            width: 34px;
            height: 34px;

            display: grid;
            place-items: center;

            border-radius: 11px;

            color: white;

            font-weight: 800;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #ec4899
                );

            box-shadow:
                0 0 25px
                rgba(139, 92, 246, .25);
        }

        .brand-name {
            font-weight: 700;
            letter-spacing: -.3px;
        }

        .new-chat {
            width: 100%;

            display: flex;
            align-items: center;

            gap: 10px;

            padding:
                11px 13px;

            border-radius: 10px;

            background: transparent;

            color: var(--text);

            border:
                1px solid var(--border);

            text-align: left;

            transition:
                background .2s,
                border-color .2s;
        }

        .new-chat:hover {
            background: var(--surface);

            border-color:
                rgba(255,255,255,.15);
        }

        .history-title {
            padding:
                24px 8px 10px;

            color: var(--muted);

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 1px;

            text-transform: uppercase;
        }

        .history {
            flex: 1;

            overflow-y: auto;

            padding-right: 3px;
        }

        .history::-webkit-scrollbar,
        .messages::-webkit-scrollbar {
            width: 5px;
        }

        .history::-webkit-scrollbar-thumb,
        .messages::-webkit-scrollbar-thumb {
            background: #303034;

            border-radius: 20px;
        }

        .history-item {
            width: 100%;

            display: flex;
            align-items: center;

            gap: 9px;

            padding: 10px;

            margin-bottom: 3px;

            border-radius: 9px;

            color: var(--muted);

            background: transparent;

            text-align: left;

            font-size: 13px;
        }

        .history-item:hover,
        .history-item.active {
            color: var(--text);
            background: var(--surface);
        }

        .history-item span:last-child {
            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;
        }

        .sidebar-footer {
            flex-shrink: 0;

            padding-top: 12px;

            border-top:
                1px solid var(--border);

            color: var(--muted);

            font-size: 11px;

            text-align: center;
        }

        .sidebar-link {
            display: block;

            padding: 8px 10px;

            margin-bottom: 6px;

            border-radius: 8px;

            color: var(--muted);

            text-decoration: none;

            font-size: 12px;

            transition:
                background .2s,
                color .2s;
        }

        .sidebar-link:hover {
            color: var(--text);

            background: var(--surface);
        }

        .qntapro-link {
            color: var(--accent-2);
        }

        .sidebar-tagline {
            padding-top: 4px;

            font-size: 11px;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            min-width: 0;

            flex: 1;

            height: 100%;

            display: flex;
            flex-direction: column;

            position: relative;
        }

        .topbar {
            height: 60px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                0 20px;

            border-bottom:
                1px solid var(--border);

            background:
                rgba(9, 9, 11, .82);

            backdrop-filter:
                blur(18px);

            z-index: 10;
        }

        .topbar-title {
            display: flex;
            align-items: center;

            gap: 10px;

            font-size: 14px;

            font-weight: 600;
        }

        .online {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #4ade80;

            box-shadow:
                0 0 10px #4ade80;
        }

        .menu-button {
            display: none;

            width: 36px;
            height: 36px;

            margin-right: 8px;

            border-radius: 9px;

            color: var(--text);

            background: transparent;
        }

        .menu-button:hover {
            background: var(--surface);
        }

        /* =========================
           MESSAGES
        ========================= */

        .messages {
            flex: 1;

            overflow-y: auto;

            scroll-behavior: smooth;

            padding:
                30px 20px 170px;
        }

        .message {
            width: 100%;

            max-width: var(--max-chat);

            margin:
                0 auto 30px;

            display: flex;

            gap: 15px;

            animation:
                messageIn .25s ease;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform:
                    translateY(8px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }
        }

        .avatar {
            width: 32px;
            height: 32px;

            flex: 0 0 32px;

            display: grid;
            place-items: center;

            border-radius: 9px;

            font-size: 13px;

            font-weight: 700;
        }

        .avatar.user {
            background: #3f3f46;
        }

        .avatar.ai {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #db2777
                );
        }

        .message-body {
            min-width: 0;

            flex: 1;

            line-height: 1.75;

            font-size: 15px;
        }

        .message-role {
            margin-bottom: 4px;

            font-size: 12px;

            color: var(--muted);

            font-weight: 600;
        }

        .message-text {
            white-space: pre-wrap;

            overflow-wrap: anywhere;
        }

        .message.user .message-body {
            padding:
                12px 15px;

            border-radius: 15px;

            background: var(--user);
        }

        .message.user .message-role {
            color: #d4d4d8;
        }

        /* =========================
           WELCOME
        ========================= */

        .welcome {
            max-width: 720px;

            margin:
                9vh auto 0;

            text-align: center;
        }
.welcome h1 {
            font-size:
                clamp(30px, 5vw, 48px);

            letter-spacing: -2px;

            margin-bottom: 12px;
        }

        .welcome p {
            color: var(--muted);

            line-height: 1.7;
        }

        .suggestions {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;

            margin-top: 30px;
        }

        .suggestion {
            padding: 14px;

            border:
                1px solid var(--border);

            border-radius: 12px;

            color: var(--muted);

            background:
                rgba(255,255,255,.02);

            text-align: left;

            transition:
                background .2s,
                color .2s,
                transform .2s;
        }

        .suggestion:hover {
            color: var(--text);

            background:
                var(--surface);

            transform:
                translateY(-2px);
        }

        /* =========================
           TYPING
        ========================= */

        .typing {
            display: flex;
            align-items: center;

            gap: 5px;

            padding-top: 8px;
        }

        .typing span {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background:
                var(--accent-2);

            animation:
                typing 1.2s
                infinite
                ease-in-out;
        }

        .typing span:nth-child(2) {
            animation-delay: .15s;
        }

        .typing span:nth-child(3) {
            animation-delay: .3s;
        }

        @keyframes typing {
            0%,
            60%,
            100% {
                opacity: .25;

                transform:
                    translateY(0);
            }

            30% {
                opacity: 1;

                transform:
                    translateY(-4px);
            }
        }

        /* =========================
           SOURCES
        ========================= */

        .sources {
            margin-top: 14px;

            display: flex;
            flex-direction: column;

            gap: 7px;
        }

        .sources-title {
            color: var(--muted);

            font-size: 11px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: .8px;
        }

        .source {
            display: block;

            padding:
                9px 11px;

            border:
                1px solid var(--border);

            border-radius: 9px;

            color: var(--muted);

            background:
                rgba(255,255,255,.02);

            font-size: 12px;

            text-decoration: none;
        }

        .source:hover {
            color: var(--text);

            background:
                var(--surface);
        }

        /* =========================
           COMPOSER
        ========================= */

        .composer-wrap {
            position: absolute;

            left: 0;
            right: 0;
            bottom: 0;

            z-index: 20;

            padding:
                12px 16px
                calc(
                    12px +
                    env(safe-area-inset-bottom)
                );

            background:
                linear-gradient(
                    to top,
                    #08080a 65%,
                    rgba(8,8,10,0)
                );
        }

        .composer {
            width: 100%;

            max-width: 900px;

            margin: 0 auto;

            display: flex;
            flex-direction: column;

            padding: 8px;

            border:
                1px solid
                rgba(255,255,255,.10);

            border-radius: 18px;

            background:
                #171719;

            box-shadow:
                0 10px 40px
                rgba(0,0,0,.25);
        }

        /* =========================
           MESSAGE ACTIONS
        ========================= */

        .message-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 9px;
        }

        .message-action {
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            border-radius: 8px;
            padding: 5px 9px;
            font-size: 12px;
            cursor: pointer;
            transition:
                background .15s,
                color .15s,
                transform .15s;
        }

        .message-action:hover {
            background: var(--surface);
            color: var(--text);
            transform: translateY(-1px);
        }

        .message-action.active {
            color: var(--text);
            background: var(--surface);
        }

        .composer-main {
            display: flex;
            align-items: flex-end;

            gap: 8px;
        }

        .composer textarea {
            flex: 1;

            min-width: 0;

            resize: none;

            border: 0;
            outline: 0;

            background: transparent;

            color: #fff;

            font: inherit;

            font-size: 16px;

            line-height: 1.45;

            min-height: 44px;

            max-height: 140px;

            padding:
                10px 6px;
        }

        .composer textarea::placeholder {
            color: #71717a;
        }

        .attachment-button {
            flex: 0 0 44px;
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border: 0;
            border-radius: 12px;
            color: var(--muted);
            background: transparent;
            font-size: 25px;
            line-height: 1;
            cursor: pointer;
            transition: background .2s, color .2s, transform .2s;
        }

        .attachment-button:hover {
            color: var(--text);
            background: var(--surface);
            transform: scale(1.04);
        }

        .attachment-button:active {
            transform: scale(.96);
        }

        .send-button {
            flex:
                0 0 44px;

            width: 44px;
            height: 44px;

            display: grid;
            place-items: center;

            border-radius: 12px;

            color: #000;

            background: #fff;

            font-size: 21px;

            transition:
                transform .2s,
                opacity .2s;
        }

        .send-button:hover:not(:disabled) {
            transform:
                scale(1.05);
        }

        .send-button:disabled {
            opacity: .35;

            cursor: not-allowed;
        }

        .model-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .model-selector label {
            color: var(--muted);
            font-size: 12px;
        }

        .model-selector select {
            appearance: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 28px 6px 9px;
            background: var(--surface);
            color: var(--text);
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }

        .model-selector select:hover {
            border-color: rgba(255,255,255,.18);
        }

        .model-selector select:focus {
            border-color: var(--accent);
        }

        .composer-bottom {
            display: flex;

            align-items: center;

            justify-content:
                space-between;

            padding:
                7px 5px 2px 5px;
        }

        .web-toggle {
            display: flex;

            align-items: center;

            gap: 8px;

            color: var(--muted);

            font-size: 12px;

            cursor: pointer;

            user-select: none;
        }

        .web-toggle input {
            display: none;
        }

        .toggle {
            width: 30px;
            height: 17px;

            position: relative;

            border-radius: 20px;

            background: #3f3f46;

            transition:
                background .2s;
        }

        .toggle::after {
            content: "";

            position: absolute;

            top: 3px;
            left: 3px;

            width: 11px;
            height: 11px;

            border-radius: 50%;

            background: white;

            transition:
                transform .2s;
        }

        .web-toggle
        input:checked
        + .toggle {
            background:
                var(--accent);
        }

        .web-toggle
        input:checked
        + .toggle::after {
            transform:
                translateX(13px);
        }

        /* =========================
           SEARCH STATUS
        ========================= */

        .search-status {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 7px 8px 3px;
            color: #71717a;
            font-size: 12px;
        }

        .search-status.active {
            display: flex;
        }

        .search-status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #8b5cf6;
            animation: searchPulse 1.2s ease-in-out infinite;
        }

        @keyframes searchPulse {
            0%, 100% {
                opacity: .35;
                transform: scale(.85);
            }

            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .composer-note {
            color: #52525b;

            font-size: 10px;

            text-align: right;
        }

        /* =========================
           MOBILE OVERLAY
        ========================= */

        .overlay {
            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,.55);

            z-index: 40;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 800px) {

            .sidebar {
                position: fixed;

                top: 0;
                bottom: 0;
                left: 0;

                transform:
                    translateX(-100%);

                box-shadow:
                    15px 0 50px
                    rgba(0,0,0,.35);
            }

            .sidebar.open {
                transform:
                    translateX(0);
            }

            .sidebar.open
            + .overlay {
                display: block;
            }

            .menu-button {
                display: grid;
                place-items: center;
            }

            .topbar {
                padding:
                    0 12px;
            }

            .messages {
                padding:
                    22px 12px 180px;
            }

            .message {
                gap: 10px;

                margin-bottom: 25px;
            }

            .avatar {
                width: 29px;
                height: 29px;

                flex-basis: 29px;
            }

            .message-body {
                font-size: 14px;
            }

            .composer-wrap {
                padding:
                    8px
                    8px
                    calc(
                        8px +
                        env(safe-area-inset-bottom)
                    );
            }

            .composer {
                border-radius: 15px;
            }

            .suggestions {
                grid-template-columns: 1fr;
            }

            .welcome {
                margin-top: 6vh;
            }
        }

        @media (max-width: 480px) {

            .welcome h1 {
                font-size: 32px;
            }

            .welcome p {
                font-size: 13px;
            }

            .composer-note {
                display: none;
            }
        }
    
    /* =====================================================
       INDIVIDUAL CHAT DELETE BUTTON
       ===================================================== */

    .history-item {
        display: flex;
        align-items: center;
        gap: 4px;
        width: 100%;
    }

    .history-chat-button {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        border: 0;
        background: transparent;
        color: inherit;
        text-align: left;
        cursor: pointer;
        padding: 9px 8px;
        border-radius: 8px;
        font: inherit;
    }

    .history-chat-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .history-delete-button {
        flex: 0 0 auto;
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        padding: 7px;
        border-radius: 7px;
        opacity: 0;
        transition:
            opacity 0.15s ease,
            background 0.15s ease,
            color 0.15s ease;
    }

    .history-item:hover .history-delete-button,
    .history-delete-button:focus-visible {
        opacity: 1;
    }

    .history-delete-button:hover {
        background: rgba(255, 70, 70, 0.12);
        color: #ff6b6b;
    }



        /* =====================================================
           QNTAAI SHINY UI v1
           Visual redesign only — existing JS/HTML preserved.
        ===================================================== */

            --bg: #f7f8fc;
            --sidebar: rgba(255,255,255,.86);

            --surface-2: #f4f5f9;
            --border: rgba(20,20,40,.09);
            --text: #17171c;
            --muted: #737681;
            --accent: #6d5dfc;
            --accent-2: #8b7cff;
            --user: #f0efff;
            --max-chat: 850px;
        }

        html {
            background: #f7f8fc;
        }

        body {
            background:
                radial-gradient(
                    circle at 50% -20%,
                    rgba(124,92,255,.12),
                    transparent 38%
                ),
                linear-gradient(
                    180deg,
                    #ffffff 0%,
                    #f7f8fc 55%,
                    #f5f6fa 100%
                );

            color: var(--text);
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            background:
                rgba(255,255,255,.78);

            border-right:
                1px solid rgba(20,20,40,.08);

            box-shadow:
                8px 0 35px rgba(40,40,80,.04);

            backdrop-filter:
                blur(22px);
        }

        .brand-icon {
            background:
                linear-gradient(
                    135deg,
                    #6d5dfc,
                    #9b8cff
                );

            box-shadow:
                0 8px 24px
                rgba(109,93,252,.20);
        }

        .brand-name {
            color: #18181d;
        }

        .new-chat {
            color: var(--text);
            background: rgba(255,255,255,.65);

            border-color:
                rgba(20,20,40,.10);

            box-shadow:
                0 2px 8px rgba(20,20,40,.03);
        }

        .new-chat:hover {
            background: #fff;

            border-color:
                rgba(109,93,252,.20);

            box-shadow:
                0 5px 18px rgba(40,40,80,.07);
        }

        .history-item {
            color: #777983;
        }

        .history-item:hover,
        .history-item.active {
            color: #24242a;

            background:
                rgba(109,93,252,.07);
        }

        .sidebar-footer {
            border-top-color:
                rgba(20,20,40,.08);
        }

        .sidebar-link:hover {
            color: var(--text);
            background: rgba(109,93,252,.07);
        }

        /* =========================
           TOPBAR
        ========================= */

        .topbar {
            background:
                rgba(255,255,255,.72);

            border-bottom:
                1px solid rgba(20,20,40,.07);

            backdrop-filter:
                blur(20px);
        }

        .topbar-title {
            color: #222228;
        }

        .menu-button {
            color: #303039;
        }

        .menu-button:hover {
            background:
                rgba(109,93,252,.08);
        }

        /* =========================
           MESSAGES
        ========================= */

        .avatar.user {
            color: #555563;

            background:
                #eeeef3;
        }

        .avatar.ai {
            background:
                linear-gradient(
                    135deg,
                    #6d5dfc,
                    #9b8cff
                );

            box-shadow:
                0 5px 15px
                rgba(109,93,252,.16);
        }

        .message-body {
            color: #27272d;
        }

        .message-role {
            color: #858691;
        }

        .message.user .message-body {
            background:
                linear-gradient(
                    135deg,
                    #f1efff,
                    #f7f6ff
                );

            border:
                1px solid
                rgba(109,93,252,.08);

            box-shadow:
                0 3px 12px
                rgba(50,40,120,.035);
        }

        .message.user .message-role {
            color: #656274;
        }

        /* =========================
           WELCOME
        ========================= */

        .welcome {
            margin-top: 10vh;
        }
.welcome h1 {
            color: #17171c;

            letter-spacing:
                -2.2px;
        }

        .welcome p {
            color: #747680;

/* ============================================================
   QntaAI MODEL SYMBOL
   CSS-only geometric symbol
   ============================================================ */

.qnta-model-control {
    display: flex;
    align-items: center;
    gap: 8px;
}

.qnta-model-symbol {
    width: 18px;
    height: 18px;
    min-width: 18px;

    border: 2px solid currentColor;
    border-radius: 5px;

    position: relative;
    display: inline-block;

    box-sizing: border-box;
}

.qnta-model-symbol::before {
    content: "";

    position: absolute;

    width: 6px;
    height: 6px;

    left: 4px;
    top: 4px;

    background: currentColor;

    border-radius: 50%;
}

.qnta-model-symbol::after {
    content: "";

    position: absolute;

    width: 2px;
    height: 10px;

    right: 2px;
    top: 2px;

    background: currentColor;

    transform: rotate(45deg);

    border-radius: 2px;
}

<script>
"use strict";

/* =========================================================
   QNTAAI
   Frontend state + UI
   ========================================================= */


/* =========================
   DOM REFERENCES
========================= */

const messagesEl =
    document.getElementById("messages");

const welcomeEl =
    document.getElementById("welcome");

const promptEl =
    document.getElementById("prompt");

const attachmentInput = document.createElement("input");
attachmentInput.type = "file";
attachmentInput.multiple = true;
attachmentInput.accept = ".pdf,.txt,.md,.doc,.docx,.csv,.json,.py,.js,.html,.css,.java,.cpp,.c,.h,.png,.jpg,.jpeg,.webp";
attachmentInput.style.display = "none";
document.body.appendChild(attachmentInput);

const attachmentButton = document.getElementById("attachmentButton");

if (attachmentButton) {
    attachmentButton.addEventListener("click", function () {
        attachmentInput.click();
    });
}


let selectedAttachments = [];

function renderAttachments() {
    const list = document.getElementById("attachmentList");

    if (!list) return;

    list.innerHTML = "";

    if (selectedAttachments.length === 0) {
        list.hidden = true;
        return;
    }

    list.hidden = false;

    selectedAttachments.forEach(function (file, index) {
        const item = document.createElement("div");
        item.className = "attachment-item";

        const icon = document.createElement("span");
        icon.className = "attachment-icon";
        icon.textContent = "📎";

        const name = document.createElement("span");
        name.className = "attachment-name";
        name.textContent = file.name;
        name.title = file.name;

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "attachment-remove";
        remove.textContent = "×";
        remove.title = "Remove " + file.name;

        remove.addEventListener("click", function () {
            selectedAttachments.splice(index, 1);
            renderAttachments();
        });

        item.appendChild(icon);
        item.appendChild(name);
        item.appendChild(remove);
        list.appendChild(item);
    });
}

attachmentInput.addEventListener("change", function () {
    const files = Array.from(attachmentInput.files || []);

    selectedAttachments = selectedAttachments.concat(files);

    renderAttachments();

    attachmentInput.value = "";
});

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const searchModeEl =
    document.getElementById("searchMode");

const searchStatus =
    document.getElementById("searchStatus");

const searchStatusText =
    document.getElementById("searchStatusText");

const modelSelect =
    document.getElementById("modelSelect");

const historyEl =
    document.getElementById("history");

const newChatButton =
    document.getElementById("newChat");

const menuButton =
    document.getElementById("menuButton");

const sidebar =
    document.getElementById("sidebar");

const overlay =
    document.getElementById("overlay");

const chatTitle =
    document.getElementById("chatTitle");

const qntaProButton =
    document.getElementById("qntaProButton");


/* =========================
   APPLICATION STATE
========================= */

let chats = [];

let currentChat = {
    id: createId(),
    title: "New chat",
    messages: [],
    conversation_id: null
};

let isLoading = false;

if (qntaProButton) {
    qntaProButton.addEventListener(
        "click",
        (event) => {
            event.preventDefault();

            alert(
                "QntaPRO is coming soon! 🚀\n\n" +
                "Advanced features will be introduced here."
            );
        }
    );
}


/* =========================
   ID GENERATOR
========================= */

function createId() {
    return (
        Date.now().toString(36) +
        Math.random()
            .toString(36)
            .slice(2, 8)
    );
}


/* =========================
   HTML ESCAPING
========================= */

function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        String(value ?? "");

    return div.innerHTML;
}


/* =========================
   SCROLL
========================= */

function scrollToBottom() {

    requestAnimationFrame(() => {

        messagesEl.scrollTop =
            messagesEl.scrollHeight;

    });
}


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;
let isListening = false;

if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.lang = "en-US";

    recognition.onstart = function () {

        isListening = true;

        micButton.textContent = "🛑";
        micButton.classList.add("listening");

    };

    recognition.onresult = function (event) {

        let transcript = "";

        for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ) {

            transcript +=
                event.results[i][0].transcript;
        }

        promptEl.value = transcript;

        autoResize();
        updateSendButton();
    };

    recognition.onerror = function (event) {

        console.error(
            "Speech recognition error:",
            event.error
        );

        isListening = false;

        micButton.textContent = "🎤";
        micButton.classList.remove("listening");
    };

    recognition.onend = function () {

        isListening = false;

        micButton.textContent = "🎤";
        micButton.classList.remove("listening");

        updateSendButton();
    };

    micButton.addEventListener(
        "click",
        function () {

            if (isListening) {

                recognition.stop();

            } else {

                try {

                    recognition.start();

                } catch (error) {

                    console.error(
                        "Could not start speech recognition:",
                        error
                    );
                }
            }
        }
    );

} else {

    micButton.disabled = true;
    micButton.title =
        "Speech recognition is not supported by this browser.";

}


/* =========================
   SEND BUTTON STATE
========================= */

function updateSendButton() {

    const hasText =
        promptEl.value.trim().length > 0;

    sendButton.disabled =
        !hasText || isLoading;
}


/* =========================
   TEXTAREA AUTO RESIZE
========================= */

function autoResize() {

    promptEl.style.height =
        "auto";

    const height =
        Math.min(
            promptEl.scrollHeight,
            140
        );

    promptEl.style.height =
        height + "px";
}


/* =========================================================
   MESSAGE UI
   ========================================================= */

function addMessage(
    role,
    text,
    options = {}
) {

    const message =
        document.createElement("div");

    message.className =
        "message " + role;


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar " +
        (
            role === "user"
                ? "user"
                : "ai"
        );

    avatar.textContent =
        role === "user"
            ? "U"
            : "Q";


    const body =
        document.createElement("div");

    body.className =
        "message-body";


    const roleLabel =
        document.createElement("div");

    roleLabel.className =
        "message-role";

    roleLabel.textContent =
        role === "user"
            ? "You"
            : "QntaAI";


    const textElement =
        document.createElement("div");

    textElement.className =
        "message-text";

    textElement.innerHTML =
        escapeHtml(text);


    body.appendChild(
        roleLabel
    );

    body.appendChild(
        textElement
    );


    if (
        Array.isArray(options.sources) &&
        options.sources.length > 0
    ) {

        addSources(
            body,
            options.sources
        );
    }


    /* =========================
       AI MESSAGE ACTIONS
    ========================= */

    if (role === "ai") {

        addMessageActions(
            body,
            text
        );
    }


    message.appendChild(
        avatar
    );

    message.appendChild(
        body
    );


    messagesEl.appendChild(
        message
    );


    scrollToBottom();

    return message;
}


/* =========================
   MESSAGE ACTIONS
========================= */

function addMessageActions(
    parent,
    text
) {

    const actions =
        document.createElement("div");

    actions.className =
        "message-actions";


    /* COPY */

    const copyButton =
        document.createElement("button");

    copyButton.type =
        "button";

    copyButton.className =
        "message-action";

    copyButton.textContent =
        "📋 Copy";

    copyButton.title =
        "Copy response";


    copyButton.addEventListener(
        "click",
        async function () {

            try {

                if (
                    navigator.clipboard &&
                    window.isSecureContext
                ) {

                    await navigator.clipboard.writeText(
                        text
                    );

                } else {

                    const area =
                        document.createElement("textarea");

                    area.value =
                        text;

                    area.style.position =
                        "fixed";

                    area.style.opacity =
                        "0";

                    document.body.appendChild(
                        area
                    );

                    area.focus();
                    area.select();

                    document.execCommand(
                        "copy"
                    );

                    area.remove();
                }

                copyButton.textContent =
                    "✅ Copied";

                setTimeout(
                    function () {
                        copyButton.textContent =
                            "📋 Copy";
                    },
                    1400
                );

            } catch (error) {

                console.error(
                    "Copy failed:",
                    error
                );

                copyButton.textContent =
                    "⚠️ Failed";

                setTimeout(
                    function () {
                        copyButton.textContent =
                            "📋 Copy";
                    },
                    1400
                );
            }
        }
    );


    /* HELPFUL */

    const upButton =
        document.createElement("button");

    upButton.type =
        "button";

    upButton.className =
        "message-action";

    upButton.textContent =
        "👍";

    upButton.title =
        "Helpful";


    /* NOT HELPFUL */

    const downButton =
        document.createElement("button");

    downButton.type =
        "button";

    downButton.className =
        "message-action";

    downButton.textContent =
        "👎";

    downButton.title =
        "Not helpful";


    upButton.addEventListener(
        "click",
        function () {

            upButton.classList.add(
                "active"
            );

            downButton.classList.remove(
                "active"
            );
        }
    );


    downButton.addEventListener(
        "click",
        function () {

            downButton.classList.add(
                "active"
            );

            upButton.classList.remove(
                "active"
            );
        }
    );


    actions.appendChild(
        copyButton
    );

    actions.appendChild(
        upButton
    );

    actions.appendChild(
        downButton
    );

    parent.appendChild(
        actions
    );
}


/* =========================
   WEB SOURCES
========================= */

function addSources(
    parent,
    sources
) {

    const container =
        document.createElement("div");

    container.className =
        "sources";


    const title =
        document.createElement("div");

    title.className =
        "sources-title";

    title.textContent =
        "Web sources";


    container.appendChild(
        title
    );


    for (
        const source of sources
    ) {

        if (!source) {
            continue;
        }


        const link =
            document.createElement("a");

        link.className =
            "source";


        link.textContent =
            source.title ||
            source.name ||
            source.url ||
            "Source";


        if (source.url) {

            link.href =
                source.url;

            link.target =
                "_blank";

            link.rel =
                "noopener noreferrer";
        }


        container.appendChild(
            link
        );
    }

    parent.appendChild(
        container
    );


    parent.appendChild(
        container
    );
}

/* =========================================================
   LOCAL CHAT STORAGE
   ========================================================= */

function saveChats() {

    try {

        localStorage.setItem(
            "qntaai_chats",
            JSON.stringify(chats)
        );

    } catch (error) {

        console.warn(
            "Could not save chat history.",
            error
        );
    }
}


function loadChats() {

    try {

        const saved =
            localStorage.getItem(
                "qntaai_chats"
            );


        if (!saved) {
            return;
        }


        const parsed =
            JSON.parse(saved);


        if (
            Array.isArray(parsed)
        ) {

            chats = parsed;
        }

    } catch (error) {

        console.warn(
            "Could not load chat history.",
            error
        );
    }
}


/* =========================================================
   SAVE CURRENT CHAT
   ========================================================= */

function getClientId() {
    let clientId = localStorage.getItem("qntaai_client_id");

    if (!clientId) {
        clientId = crypto.randomUUID();
        localStorage.setItem("qntaai_client_id", clientId);
    }

    return clientId;
}


function saveCurrentChat() {

    if (
        currentChat.messages.length === 0
    ) {
        return;
    }


    const index =
        chats.findIndex(
            chat =>
                chat.id ===
                currentChat.id
        );


    if (index === -1) {

        chats.unshift(
            structuredClone(
                currentChat
            )
        );

    } else {

        chats[index] =
            structuredClone(
                currentChat
            );
    }


    saveChats();

    renderHistory();
}


/* =========================================================
   CHAT HISTORY UI
   ========================================================= */

function renderHistory() {
    historyEl.innerHTML = "";

    if (chats.length === 0) {
        const empty = document.createElement("div");

        empty.style.padding = "12px 8px";
        empty.style.color = "var(--muted)";
        empty.style.fontSize = "12px";
        empty.textContent = "No conversations yet.";

        historyEl.appendChild(empty);
        return;
    }

    for (const chat of chats) {
        const item = document.createElement("div");

        item.className = "history-item";

        if (chat.id === currentChat.id) {
            item.classList.add("active");
        }

        const button = document.createElement("button");

        button.type = "button";
        button.className = "history-chat-button";

        button.innerHTML = `
            <span>💬</span>
            <span class="history-chat-title">
                ${escapeHtml(chat.title || "New chat")}
            </span>
        `;

        button.addEventListener("click", () => {
            loadChat(chat.id);
        });

        const deleteButton = document.createElement("button");

        deleteButton.type = "button";
        deleteButton.className = "history-delete-button";
        deleteButton.title = "Delete chat";
        deleteButton.setAttribute(
            "aria-label",
            `Delete ${chat.title || "chat"}`
        );
        deleteButton.textContent = "🗑️";

        deleteButton.addEventListener("click", event => {
            event.stopPropagation();
            deleteChat(chat.id);
        });

        item.appendChild(button);
        item.appendChild(deleteButton);

        historyEl.appendChild(item);
    }
}


/* =========================================================
   LOAD CHAT
   ========================================================= */

function loadChat(chatId) {

    const chat =
        chats.find(
            item =>
                item.id === chatId
        );


    if (!chat) {
        return;
    }


    currentChat =
        structuredClone(chat);


    chatTitle.textContent =
        currentChat.title ||
        "New chat";


    messagesEl.innerHTML =
        "";


    for (
        const message
        of currentChat.messages
    ) {

        if (
            message.role ===
            "user"
        ) {

            addMessage(
                "user",
                message.content
            );

        } else if (
            message.role ===
            "assistant"
        ) {

            addMessage(
                "ai",
                message.content,
                {
                    sources:
                        message.sources
                }
            );
        }
    }


    renderHistory();

    closeSidebar();

    scrollToBottom();
}


/* =========================================================
   NEW CHAT
   ========================================================= */

function startNewChat() {

    saveCurrentChat();


    currentChat = {
        id: createId(),
        title: "New chat",
        messages: [],
        conversation_id: null
    };


    chatTitle.textContent =
        "New chat";


    messagesEl.innerHTML = `

        <div
            class="welcome"
            id="welcome"
        >
<h1>
                What are you curious about?
            </h1>

            <p>
                I'm QntaAI — your AI tutor.
                Ask me anything and let's
                explore it together.
            </p>

            

        </div>
    `;


    promptEl.value =
        "";


    autoResize();

    updateSendButton();

    renderHistory();

    closeSidebar();

    promptEl.focus();
}


/* =========================================================
   EVENT LISTENERS
   ========================================================= */

promptEl.addEventListener(

);

            }
        }

);


sendButton.addEventListener(
    "click",

);


newChatButton.addEventListener(

);

    openSidebar
);


overlay.addEventListener(
    "click",

);


/* =========================================================
   SUGGESTION BUTTONS
   ========================================================= */

document.addEventListener(
    "click",
    event => {

        const button =
            event.target.closest(
                ".suggestion"
            );


        if (!button) {

        }


        const prompt =

        if (!prompt) {

        }


        promptEl.value =
            prompt;


        autoResize();

        updateSendButton();

        promptEl.focus();
    }
);

/* =========================================================
   SEND MESSAGE
========================================================= */

function showSearchStatus(text = "Searching the web...") {
    if (!searchStatus) {
        return;
    }

    searchStatusText.textContent = text;
    searchStatus.classList.add("active");
}


function hideSearchStatus() {
    if (!searchStatus) {
        return;
    }

    searchStatus.classList.remove("active");
}


async function sendMessage() {

    if (isLoading) {
        return;
    }


    const text =
        promptEl.value.trim();


    if (!text) {
        return;
    }


    /* =========================
       PREPARE UI
    ========================= */

    hideWelcome();


    addMessage(
        "user",
        text
    );


    currentChat.messages.push({
        role: "user",
        content: text
    });


    /* =========================
       CHAT TITLE
    ========================= */

    if (
        currentChat.messages.length === 1
    ) {

        currentChat.title =
            text.length > 42
                ? text.slice(0, 42) + "…"
                : text;

        chatTitle.textContent =
            currentChat.title;
    }


    /* =========================
       CLEAR INPUT
    ========================= */

    promptEl.value = "";

    autoResize();

    updateSendButton();


    /* =========================
       LOADING STATE
    ========================= */

    isLoading = true;

    updateSendButton();

    const selectedSearchMode =
    searchModeEl
        ? searchModeEl.value
        : "quick";

if (
    selectedSearchMode === "search" ||
    selectedSearchMode === "research"
) {
    showSearchStatus(
        selectedSearchMode === "research"
            ? "Researching the web..."
            : "Searching the web..."
    );
}

    addTypingMessage();


    try {

        /* =========================
           CALL FLASK BACKEND
        ========================= */

        const response =
            await fetch(
                "/api/chat",
                {
                    method: "POST",

                    body: (() => {
                        const formData = new FormData();

                        formData.append(
                            "conversation_id",
                            currentChat.conversation_id || ""
                        );

                        formData.append(
                            "client_id",
                            getClientId()
                        );

                        formData.append(
                            "messages",
                            JSON.stringify(currentChat.messages)
                        );

                        formData.append(
    "mode",
    searchModeEl
        ? searchModeEl.value
        : "quick"
);

                        formData.append(
                            "model",
                            modelSelect.value
                        );

                        selectedAttachments.forEach(
                            file => formData.append("files", file)
                        );

                        return formData;
                    })()
                }
            );


        /* =========================
           READ RESPONSE
        ========================= */

        let data = null;


        try {

            data =
                await response.json();

            if (
                data &&
                data.conversation_id
            ) {
                currentChat.conversation_id =
                    data.conversation_id;
            }

        } catch (jsonError) {

            console.error(
                "Invalid JSON response:",
                jsonError
            );
        }


        removeTypingMessage();


        /* =========================
           SERVER ERROR
        ========================= */

        if (!response.ok) {

            const errorMessage =
                data &&
                data.error
                    ? data.error
                    : "QntaAI could not process the request.";


            addMessage(
                "ai",
                "⚠️ " +
                errorMessage
            );


            return;
        }


        /* =========================
           GET AI RESPONSE
        ========================= */

        const reply =
            data &&
            typeof data.reply === "string"
                ? data.reply
                : "";


        if (!reply) {

            addMessage(
                "ai",
                "⚠️ QntaAI returned an empty response."
            );


            return;
        }


        /* =========================
           SOURCES
        ========================= */

        const sources =
            data &&
            Array.isArray(data.sources)
                ? data.sources
                : [];


        /* =========================
           SHOW AI MESSAGE
        ========================= */

        addMessage(
            "ai",
            reply,
            {
                sources:
                    sources
            }
        );


        /* =========================
           SAVE AI MESSAGE
        ========================= */

        currentChat.messages.push({
            role: "assistant",
            content: reply,
            sources: sources
        });


        /* =========================
           SAVE MEMORY
        ========================= */

        saveCurrentChat();


    } catch (error) {

        console.error(
            "QntaAI request failed:",
            error
        );


        removeTypingMessage();


        addMessage(
            "ai",
            "⚠️ I couldn't connect to the QntaAI server."
        );


    } finally {

        /* =========================
           RESTORE UI
        ========================= */

        hideSearchStatus();

        isLoading = false;

        updateSendButton();

        promptEl.focus();

        scrollToBottom();
    }
}
/* =========================================================
   CHAT MEMORY HELPERS
========================================================= */

async function deleteChat(chatId) {
    const chat = chats.find(
        item => item.id === chatId
    );

    if (!chat) {
        return;
    }

    const confirmed = window.confirm(
        `Delete "${chat.title || "New chat"}"?`
    );

    if (!confirmed) {
        return;
    }

    chats = chats.filter(
        item => item.id !== chatId
    );

    saveChats();

    if (currentChat.id === chatId) {
        currentChat = {
            id: createId(),
            title: "New chat",
            messages: [],
            conversation_id: null
        };

        chatTitle.textContent = "New chat";

        messagesEl.innerHTML = `
            <div
                class="welcome"
                id="welcome"
            >
<h1>
                    What are you curious about?
                </h1>

                <p>
                    I'm QntaAI — your AI tutor.
                    Ask me anything and let's
                    explore it together.
                </p>
            </div>
        `;
    }

    renderHistory();
}


function clearAllChats() {

    const confirmed =
        window.confirm(
            "Delete all saved QntaAI conversations?"
        );


    if (!confirmed) {
        return;
    }


    chats = [];


    try {

        localStorage.removeItem(
            "qntaai_chats"
        );

    } catch (error) {

        console.warn(
            "Could not clear saved chats.",
            error
        );
    }


    startNewChat();
}


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        /*
         * Ctrl + K / Cmd + K
         * starts a new conversation.
         */

        const modifier =
            event.ctrlKey ||
            event.metaKey;


        if (
            modifier &&
            event.key.toLowerCase() === "k"
        ) {

            event.preventDefault();

            startNewChat();

            return;
        }


        /*
         * Escape closes the mobile sidebar.
         */

        if (
            event.key === "Escape"
        ) {

            closeSidebar();
        }
    }
);


/* =========================================================
   MOBILE SIDEBAR
========================================================= */

window.addEventListener(
    "resize",
    () => {

        if (
            window.innerWidth > 800
        ) {

            closeSidebar();
        }
    }
);


/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState ===
            "hidden"
        ) {

            saveCurrentChat();
        }
    }
);


/* =========================================================
   BEFORE PAGE CLOSE
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        saveCurrentChat();
    }
);
/* =========================================================
   FINAL INITIALIZATION
========================================================= */

loadChats();

renderHistory();

autoResize();

updateSendButton();

promptEl.focus();


/* =========================================================
   FINAL SAFETY CHECK
========================================================= */

window.QntaAI = {
    getCurrentChat: function () {
        return currentChat;
    },

    getChatCount: function () {
        return chats.length;
    },

    clearChats: function () {
        clearAllChats();
    }
};
